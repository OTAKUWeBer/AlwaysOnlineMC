<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#00f2fe" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Pattern -->
  <g opacity="0.12">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200" stroke="#00f2fe" stroke-width="1" />
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M1000,0 V400 M1100,0 V400" stroke="#00f2fe" stroke-width="1" />
  </g>

  <!-- Left Icon / Guardian Shield & Minecraft Cube -->
  <g transform="translate(130, 200)" filter="url(#dropShadow)">
    <path d="M0,-90 L80,-50 L80,30 Q80,95 0,120 Q-80,95 -80,30 L-80,-50 Z" fill="#0b1120" stroke="url(#shieldGrad)" stroke-width="5" />
    <polygon points="0,-40 38,-20 0,0 -38,-20" fill="#00f2fe" opacity="0.9" />
    <polygon points="-38,-20 0,0 0,44 -38,24" fill="#0284c7" opacity="0.85" />
    <polygon points="0,0 38,-20 38,24 0,44" fill="#6366f1" opacity="0.95" />
    <circle cx="0" cy="80" r="8" fill="#10b981" filter="url(#neonGlow)" />
    <circle cx="0" cy="80" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Typography & Headings -->
  <g transform="translate(265, 145)">
    <!-- Status Pill -->
    <rect x="0" y="-65" width="220" height="32" rx="16" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="18" cy="-49" r="5" fill="#10b981" />
    <text x="32" y="-44" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">24/7 UPTIME GUARDIAN</text>

    <!-- Main Title -->
    <text x="0" y="25" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      AlwaysOnline<tspan fill="url(#cyanPurple)">MC</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="75" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      High-Resilience 24/7 Anti-AFK Bot for Minecraft Java &amp; Aternos
    </text>

    <!-- Tasteful Badges with Icons -->
    <g transform="translate(0, 115)">
      <!-- Tag 1: MC 1.8 - 1.21.x -->
      <rect x="0" y="0" width="175" height="36" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="87.5" y="23" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#a5b4fc" text-anchor="middle">⚡ MC 1.8 - 1.21.x</text>

      <!-- Tag 2: Aternos Failover -->
      <rect x="190" y="0" width="195" height="36" rx="10" fill="#083344" stroke="#06b6d4" stroke-width="1.5" />
      <text x="287.5" y="23" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#67e8f9" text-anchor="middle">🔄 Aternos Failover</text>

      <!-- Tag 3: Free Cloud Ready -->
      <rect x="400" y="0" width="165" height="36" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="482.5" y="23" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">☁️ Cloud Ready</text>

      <!-- Tag 4: Humanized AI -->
      <rect x="580" y="0" width="175" height="36" rx="10" fill="#3b0764" stroke="#c084fc" stroke-width="1.5" />
      <text x="667.5" y="23" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">🤖 Smart Anti-AFK</text>
    </g>
  </g>
</svg>
